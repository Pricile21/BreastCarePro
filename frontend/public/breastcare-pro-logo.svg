  </defs>
  <!-- Icon: rounded square with heart -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="url(#logoBg)" filter="url(#logoShadow)"/>
  <path d="M24 14.2C22.2 12.4 19.2 12.4 17.4 14.2c-2.4 2.4-2.4 6.2 0 8.6L24 38l6.6-15.2c2.4-2.4 2.4-6.2 0-8.6-1.8-1.8-4.8-1.8-6.6 0z" fill="white"/>
